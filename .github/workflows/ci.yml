name: Validate and build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: homebox-ui-dist
          path: dist/
  image:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Smoke test published container
        run: |
          image="ghcr.io/${{ github.repository }}:sha-${GITHUB_SHA::7}"
          docker run --detach --name homebox-ui-smoke --publish 127.0.0.1:3101:80 "$image"
          trap 'docker logs homebox-ui-smoke; docker rm --force homebox-ui-smoke' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:3101/healthz
          curl --fail http://127.0.0.1:3101/ > /tmp/homebox-ui-index.html
          test -s /tmp/homebox-ui-index.html
          docker exec homebox-ui-smoke nginx -t
