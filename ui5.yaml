specVersion: "4.0"
metadata:
  name: homebox
type: application
framework:
  name: OpenUI5
  version: "1.154.0"
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: sap.tnt
    - name: sap.ui.layout
    - name: sap.ui.unified
    - name: themelib_sap_horizon
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        targetBrowsers: "last 2 Chrome versions, last 2 Firefox versions, last 2 Safari versions"
        generateTsInterfaces: false
        omitTSFromBuildResult: true
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        generateTsInterfaces: false
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /api
      configuration:
        baseUri: http://localhost:7745/api
